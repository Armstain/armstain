<svg xmlns="http://www.w3.org/2000/svg" width="380" height="190" viewBox="0 0 380 190" role="img" aria-label="NetLens — Chrome side-panel network inspector">
<style>
:root{--bg:#f6f8fa;--bd:#d0d7de;--fg:#1f2328;--mute:#59636e;--acc:#1a7f37}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--bd:#30363d;--fg:#f0f6fc;--mute:#9198a1;--acc:#3fb950}}
.t{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}.s{font:400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--mute)}.l{font:400 13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--fg)}.a{fill:var(--acc);font:700 13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<rect x=".5" y=".5" width="379" height="189" rx="12" fill="var(--bg)" stroke="var(--bd)"/>
<circle cx="22" cy="22" r="5" fill="#ff5f56"/><circle cx="40" cy="22" r="5" fill="#ffbd2e"/><circle cx="58" cy="22" r="5" fill="#27c93f"/>
<line x1="0" y1="40" x2="380" y2="40" stroke="var(--bd)"/>
<text x="24" y="78" class="t">NetLens</text>
<text x="24" y="100" class="s">Chrome side-panel network inspector</text>
<text x="24" y="132" class="l"><tspan class="a">›</tspan> fetch / XHR / WS / SSE</text>
<text x="24" y="154" class="l"><tspan class="a">›</tspan> replay + diff</text>
<text x="24" y="176" class="l"><tspan class="a">›</tspan> no DevTools needed</text>
</svg>
